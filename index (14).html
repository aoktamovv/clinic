<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClinicAnalytics — sotuv bo'limi statistikasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA;--card:#FFFFFF;--line:#E6EAF2;--ink:#0F1B33;--ink2:#3B4863;--muted:#7A869E;
  --blue:#2F6BFF;--blue-s:#E9F0FF;--blue-m:#8FB0FF;
  --green:#11A56B;--green-s:#E1F5EC;
  --orange:#EE8A2B;--orange-s:#FFF0DF;
  --purple:#7B5BF6;--purple-s:#EEE9FF;
  --red:#E5484D;--red-s:#FDEBEC;
  --pink:#E5599B;--pink-s:#FCE8F2;--teal:#0EA5B7;--teal-s:#E1F5F8;
  --gray:#A5AFC3;--gray-s:#EEF1F6;
  --side:#0D1A35;--side-hover:#152648;--side-ink:#B9C5DE;
  --shadow:0 1px 2px rgba(15,27,51,.04),0 4px 14px rgba(15,27,51,.04);
  --hover:#F6F8FC;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1120;--card:#111B31;--line:#213050;--ink:#E8EEFB;--ink2:#B7C3DC;--muted:#8592AE;
    --blue-s:#16294F;--green-s:#0F2E25;--orange-s:#33230F;--purple-s:#241E4A;--red-s:#3A181B;--gray-s:#1A2540;--pink-s:#3A1830;--teal-s:#0F2E33;
    --side:#081127;--side-hover:#12213F;--hover:#16223C;--shadow:none;--blue-m:#3F5F9E;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1120;--card:#111B31;--line:#213050;--ink:#E8EEFB;--ink2:#B7C3DC;--muted:#8592AE;
  --blue-s:#16294F;--green-s:#0F2E25;--orange-s:#33230F;--purple-s:#241E4A;--red-s:#3A181B;--gray-s:#1A2540;--pink-s:#3A1830;--teal-s:#0F2E33;
  --side:#081127;--side-hover:#12213F;--hover:#16223C;--shadow:none;--blue-m:#3F5F9E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff;flex:none}
.brand b{display:block;color:#fff;font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand small{font-size:11px;line-height:1.25;display:block;color:#8FA0C3}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--side-ink);padding:11px 12px;border-radius:10px;text-align:left;font-weight:500}
.nav button:hover{background:var(--side-hover);color:#fff}
.nav button.on{background:var(--blue);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.ws,.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;color:#DCE5F7}
.ws{background:rgba(255,255,255,.05)}
button.ws{border:0;width:100%;text-align:left;cursor:pointer;font:inherit}
button.ws:hover{background:rgba(255,255,255,.11)}
.ws>div{min-width:0;flex:1}
.ws b,.ws small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws .cv{margin-left:auto;color:#8FA0C3;width:16px;height:16px}
.brm{position:fixed;z-index:70;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(8,15,32,.28);width:250px;max-height:min(70vh,520px);overflow:auto;padding:6px;display:none}
.brm.on{display:block}
.brm h4{margin:6px 10px 4px;font-size:11.5px;color:var(--muted);font-weight:600}
.brm button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;font-size:13px;color:var(--ink)}
.brm button:hover{background:var(--hover)}
.brm button.on{background:var(--blue-s);color:var(--blue);font-weight:600}
.brm .ct{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
.br-m{display:none}
.hb.w4 .r{grid-template-columns:78px 1fr 40px 44px}
.hb.w6 .r{grid-template-columns:130px 1fr 40px 44px}
.phhit{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--orange-s);font-size:12.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;line-height:1.35}
.phhit.ok{background:var(--green-s)}
.phhit .btn{flex:none}
.mg-h,.mg-r{display:grid;grid-template-columns:minmax(160px,240px) minmax(200px,1fr) 110px 70px 90px 96px;align-items:center;gap:14px}
.mg.nochg .mg-h,.mg.nochg .mg-r{grid-template-columns:minmax(160px,240px) minmax(200px,1fr) 110px 70px 90px}
.mg-h{font-size:11.5px;color:var(--muted);padding:0 4px 8px;border-bottom:1px solid var(--line)}
.mg-h .r{text-align:right}
.mg-r{padding:11px 4px;border-bottom:1px solid var(--line)}
.mg-r:last-child{border-bottom:0;padding-bottom:2px}
.mg-r .who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;min-width:0}
.mg-r .who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-bar{display:flex;align-items:center;gap:10px;min-width:0}
.mg-bar .t{flex:1;height:9px;background:var(--gray-s);border-radius:99px;overflow:hidden}
.mg-bar .t i{display:block;height:100%;background:var(--teal);border-radius:99px}
.mg-bar b{min-width:42px;text-align:right;font-size:14px}
.mg-bar em{font-style:normal;color:var(--muted);font-size:12px;min-width:32px;text-align:right}
.mg-m{display:contents}
.mg-m>span{font-size:13px;text-align:right}
@media (max-width:820px){.mg-h{display:none}.mg-r,.mg.nochg .mg-r{grid-template-columns:1fr;gap:8px}.mg-m{display:flex;flex-wrap:wrap;gap:4px 16px}.mg-m>span{text-align:left;color:var(--ink2)}.mg-m>span::before{content:attr(data-l) ": ";color:var(--muted)}}
.ws small,.me small{display:block;color:#8FA0C3;font-size:11.5px}
.ws b,.me b{font-weight:600;font-size:13px;color:#fff}

/* top bar */
.main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.search{flex:1;max-width:520px;position:relative}
.search .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 60px 0 40px;outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-s)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:11px Inter,sans-serif;color:var(--muted);background:var(--gray-s);padding:2px 7px;border-radius:6px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.sel{height:42px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;outline:none;color:var(--ink)}
.sel:disabled{opacity:.5;cursor:not-allowed}
.sel:focus{border-color:var(--blue)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;color:var(--ink2)}
.iconbtn i{position:absolute;top:9px;right:10px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--card)}
.usr{display:flex;align-items:center;gap:10px}
.usr b{display:block;font-weight:600;line-height:1.2}
.usr small{color:var(--muted);font-size:12px}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}

#view{padding:6px 26px 40px}
h1{font-size:26px;letter-spacing:-.02em;margin:10px 0 2px;font-weight:700}
h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:0 0 18px}
.muted{color:var(--muted)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.link{background:none;border:0;color:var(--blue);font-size:12.5px;font-weight:500;padding:0;display:inline-flex;align-items:center;gap:4px}
.link .i{width:14px;height:14px}
.pill{background:var(--gray-s);color:var(--muted);font-size:12px;padding:3px 10px;border-radius:99px}

.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:stretch}
.dash>.col>.card:last-child{flex:1 1 auto}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.row2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.row2.srcrow{grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:1450px){.row2.srcrow{grid-template-columns:minmax(0,1fr)}}
.row2b{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:18px}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.svc-card{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px}
.svc-card b{display:block;font-size:19px;line-height:1.2}
.svc-card small{color:var(--muted);font-size:12px}
.kpi{padding:14px}
.kpis5{grid-template-columns:repeat(5,1fr)}
.kpis5 .kpi{display:flex;flex-direction:column;justify-content:space-between;min-height:148px;padding:18px 16px}
.kpis5 .kpi .k-v{margin:6px 0 2px}
@media (max-width:960px){.kpis5{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.kpis5{grid-template-columns:1fr}}
.kpi .k-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.k-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .k-l{font-size:12px;color:var(--ink2);line-height:1.25}
.kpi .k-v{font-size:24px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.kpi .k-v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi.rev .k-v{font-size:20px}
.dl{font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px}
.dl .i{width:13px;height:13px}
.dl.up{color:var(--green)}.dl.down{color:var(--red)}.dl.n{color:var(--muted);font-weight:500}
.dl-s{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
.c-blue{background:var(--blue-s);color:var(--blue)}
.c-green{background:var(--green-s);color:var(--green)}
.c-purple{background:var(--purple-s);color:var(--purple)}
.c-orange{background:var(--orange-s);color:var(--orange)}
.c-red{background:var(--red-s);color:var(--red)}
.c-pink{background:var(--pink-s);color:var(--pink)}
.c-teal{background:var(--teal-s);color:var(--teal)}

/* funnel */
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 150px;gap:12px;align-items:stretch}
.fn{border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
.fn:not(:nth-child(4))::after{content:"";position:absolute;right:-11px;top:50%;width:10px;height:10px;border-top:2px solid var(--blue);border-right:2px solid var(--blue);transform:translateY(-50%) rotate(45deg);z-index:1}
.fn .fl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);line-height:1.25;min-height:32px}
.fn .fl .k-ic{width:28px;height:28px;border-radius:8px}
.fn .fl .i{width:15px;height:15px}
.fn b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:6px}
.fn span.fp{font-size:12px;color:var(--green);font-weight:600}
.fn .fs{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.conv{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--ink2);gap:6px}

/* donut */
.donut{position:relative;flex:none}
.donut svg{display:block;transform:rotate(-90deg)}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .dc b{font-size:20px;letter-spacing:-.02em;line-height:1.1}
.donut .dc span{font-size:11.5px;color:var(--muted)}
.dwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.leg{flex:1;min-width:210px;display:flex;flex-direction:column;gap:10px}
.leg div{display:flex;align-items:center;gap:8px;font-size:13px}
.leg i{width:9px;height:9px;border-radius:50%;flex:none}
.leg span{margin-left:auto;display:flex;gap:10px}
.leg span b{font-weight:600;min-width:34px;text-align:right}
.leg span em{font-style:normal;color:var(--muted);min-width:40px;text-align:right}

/* tables */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:10px 10px;background:var(--gray-s);white-space:nowrap}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
th.r,td.r{text-align:right}
td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
tbody td.click{cursor:pointer}
tbody tr:has(td.click:hover) td{background:var(--hover)}
.xbtn.sm2{width:28px;height:28px}
.who{display:flex;align-items:center;gap:10px;font-weight:600}
.spec{color:var(--blue)}
.chev{color:var(--muted);width:16px;height:16px}

/* status badges */
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.st0{background:var(--gray-s);color:var(--muted)}
.st1{background:var(--blue-s);color:var(--blue)}
.st2{background:var(--blue-s);color:var(--blue)}
.st3{background:var(--orange-s);color:var(--orange)}
.st4{background:var(--purple-s);color:var(--purple)}
.st5{background:var(--green-s);color:var(--green)}
.stf{background:var(--red-s);color:var(--red)}
.sv0{background:var(--blue-s);color:var(--blue)}.sv1{background:var(--purple-s);color:var(--purple)}.sv2{background:var(--green-s);color:var(--green)}.sv3{background:var(--teal-s);color:var(--teal)}.sv4{background:var(--pink-s);color:var(--pink)}.sv5{background:var(--orange-s);color:var(--orange)}.sv6{background:var(--red-s);color:var(--red)}.sv7{background:var(--gray-s);color:var(--muted)}
.bds{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:0}

/* bars */
.bars{display:flex;align-items:flex-end;gap:12px;height:190px;padding-top:6px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.bar .bv{font-size:11.5px;color:var(--ink2);font-weight:600}
.bar .bb{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar i{display:block;width:100%;max-width:46px;background:var(--blue-m);border-radius:6px 6px 0 0;min-height:2px;transition:height .5s}
.bar.on i{background:var(--blue)}
.gbars .bb{gap:3px}
.gbars i{max-width:16px;border-radius:4px 4px 0 0}
.hb{display:flex;flex-direction:column;gap:11px}
.hb .r{display:grid;grid-template-columns:54px 1fr 40px 44px;align-items:center;gap:10px;font-size:12.5px}
.hb .r .t{height:7px;background:var(--gray-s);border-radius:99px;overflow:hidden}
.hb .r .t i{display:block;height:100%;background:var(--blue);border-radius:99px}
.hb .r .p{color:var(--muted);text-align:right}
.hb .r .n{text-align:right;font-weight:600}
.hb.w .r{grid-template-columns:118px 1fr 44px}
.legend-row{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend-row i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.bv3{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:700;line-height:1.2;margin-bottom:2px}

/* aside blocks */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 12px;text-align:left;font-size:12.5px;font-weight:500}
.qa button:hover{background:var(--hover);border-color:var(--blue-m)}
.qa .i{color:var(--blue)}
.rp{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rp .ln{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rp .ln b{flex:1;min-width:0}
.rp .ln small{white-space:nowrap}
.rp .ln .bd{font-size:11px;padding:2px 8px;flex:0 1 auto;min-width:0;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp:last-child{border-bottom:0}
.rp:hover b{color:var(--blue)}
.rp .mid{flex:1;min-width:0}
.rp b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp small{color:var(--muted);font-size:12px}
.rp .end{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end;min-width:0;max-width:62%}
.rp .end .bd{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp .end small{font-size:11px}
.insight{background:linear-gradient(0deg,var(--green-s),var(--green-s));border-color:transparent}
.insight p{margin:0 0 12px;color:var(--ink2);line-height:1.55}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px}

/* toolbar */
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tb .sp{flex:1}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:8px}
.pg{display:flex;gap:6px}
.pg button{min-width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:12.5px}
.pg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pg button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}

/* patient detail */
.pd{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.prof{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.prof h1{margin:0 0 6px;font-size:22px}
.kv{display:grid;grid-template-columns:22px 1fr;gap:8px 8px;margin-top:12px;color:var(--ink2);align-items:center}
.kv .i{width:16px;height:16px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl li:last-child{border-bottom:0}
.tl .d{color:var(--muted)}
.tl .m{color:var(--muted);font-size:12px}
.tl li.cur{background:var(--blue-s);border-radius:10px;padding-left:10px;padding-right:10px}
.tl li[data-pid]{cursor:pointer}
.tl li[data-pid]:hover .d{color:var(--blue)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--ink2);font-weight:500}
.field input,.field select,.field textarea{width:100%;height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;outline:none}
.field textarea{height:96px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-s)}
.field input[readonly]{background:var(--gray-s);color:var(--muted)}
.field.bad input,.field.bad select{border-color:var(--red)}
.field .er{color:var(--red);font-size:11.5px;display:none}
.field.bad .er{display:block}

/* modal */
.ov{position:fixed;inset:0;background:rgba(8,15,32,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.md{background:var(--card);border-radius:16px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;border:1px solid var(--line);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.md-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.md-h h2{font-size:17px}
.md-g{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.md-g h3{font-size:12.5px;margin:0 0 12px;color:var(--muted);font-weight:600}
.md-f{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.xbtn{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.xbtn:hover{background:var(--gray-s)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0F1B33;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
#chartTip{position:fixed;background:#0F1B33;color:#fff;font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;pointer-events:none;z-index:70;opacity:0;transform:translate(-50%,-130%);white-space:nowrap}
#chartTip.on{opacity:1}

/* report */
.rep h3{font-size:14px;margin:22px 0 8px}
.rep .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.rep .rh h2{font-size:19px}
.chg.up{color:var(--green);font-weight:600}.chg.down{color:var(--red);font-weight:600}.chg.n{color:var(--muted)}

/* live clock card */
.live{background:linear-gradient(135deg,#16295a 0%,#2F6BFF 100%);color:#fff;border:0;position:relative;overflow:hidden}
.live::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.live .lv-top{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;opacity:.92}
.live-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);padding:3px 11px;border-radius:99px;font-weight:600}
.live-dot{width:8px;height:8px;border-radius:50%;background:#3DDC97;animation:lvp 1.6s infinite}
@keyframes lvp{0%{box-shadow:0 0 0 0 rgba(61,220,151,.65)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.lv-time{font-size:42px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:12px 0 2px}
.lv-time small{font-size:22px;opacity:.65;font-weight:600;margin-left:2px}
.lv-date{font-size:13.5px;opacity:.94}
.lv-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.lv-stats>div{background:rgba(255,255,255,.13);border-radius:12px;padding:10px 12px}
.lv-stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.lv-stats span{font-size:11.5px;opacity:.88}
.lv-month{margin-top:10px;background:rgba(255,255,255,.13);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.lv-mt{font-size:13px}.lv-mt b{font-size:17px}
.lv-ms{font-size:11.5px;opacity:.85}
.lv-chip{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.22);white-space:nowrap}
.lv-foot{margin-top:12px;font-size:11.5px;opacity:.82}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
/* settings */
.lv-goals{margin-top:10px;background:rgba(255,255,255,.13);border-radius:12px;padding:10px 12px}
.gl{margin-top:8px}.gl:first-of-type{margin-top:0}
.gl-h{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:5px}.gl-h b{font-variant-numeric:tabular-nums;white-space:nowrap}
.gl-b{height:8px;border-radius:99px;background:var(--gray-s);overflow:hidden}.gl-b i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.gl.lv .gl-b{background:rgba(255,255,255,.22)}.gl.lv .gl-b i{background:#3DDC97}
.aud-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.aud-f .sel,.aud-d input{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:0 10px;max-width:220px}
.aud-d{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.aud-ch{white-space:normal;min-width:200px;font-size:12.5px;line-height:1.45}
.aud-p{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.note-warn{background:var(--orange-s);color:var(--ink);border-radius:10px;padding:12px 14px;line-height:1.5;font-size:13px}
.setwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
.setnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.setnav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:0;background:none;text-align:left;font-weight:500;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.setnav button .i{color:var(--muted);flex:none;width:16px;height:16px}
.setnav button:hover{background:var(--hover)}
.setnav button.on{background:var(--blue);color:#fff}
.setnav button.on .i{color:#fff}
.setbody{min-width:0;display:flex;flex-direction:column;gap:16px}
.stitle{margin:0 0 2px}
.tgl{width:42px;height:24px;border-radius:99px;background:var(--gray-s);border:1px solid var(--line);position:relative;padding:0;flex:none;cursor:pointer}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tgl.on{background:var(--blue);border-color:var(--blue)}
.tgl.on::after{transform:translateX(18px)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .tt{font-weight:600;font-size:13.5px}
.trow .td{color:var(--muted);font-size:12px;margin-top:2px}
.swrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:2px}
.swatch{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer;position:relative;flex:none}
.swatch.on{border-color:var(--ink)}
.swatch.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--gray-s);color:var(--ink2);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:500}
.chip button{border:0;background:none;color:var(--muted);width:16px;height:16px;display:grid;place-items:center;padding:0}
.chip button:hover{color:var(--red)}
.avup{width:64px;height:64px;border-radius:50%;flex:none;object-fit:cover}
.avuprow{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.permtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.permtbl th,.permtbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.permtbl th:first-child,.permtbl td:first-child{text-align:left}
.permtbl th{color:var(--muted);font-weight:500;font-size:11.5px}
.permtbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
.permtbl2{width:100%;border-collapse:collapse;font-size:13px}
.permtbl2 th,.permtbl2 td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.permtbl2 th{color:var(--muted);font-weight:500;font-size:11.5px}
.pchk{display:inline-flex;align-items:center;gap:6px;margin:0 14px 4px 0;font-size:12.5px;color:var(--ink2)}
.pchk input{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
.pchk.off{opacity:.4}
.pchk.off input{cursor:not-allowed}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--gray-s);padding:8px 12px;border-radius:8px;display:inline-flex;align-items:center;gap:10px;word-break:break-all}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.schk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px}
.schk input{width:16px;height:16px;accent-color:var(--blue)}
.dlcard{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px 16px;cursor:pointer;color:var(--ink)}
.dlcard:hover{border-color:var(--blue);background:var(--blue-s)}
.dlcard b{display:block;font-size:14px;margin-bottom:2px}
.dlcard small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.fmtopt{flex:1;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:13px}
.fmtopt input{width:14px;height:14px;accent-color:var(--blue);flex:none;margin:0}
.fmtopt:has(input:checked){border-color:var(--blue)}
.intcard{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.intcard:last-child{margin-bottom:0}
.inth{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.inth b{flex:1}
.demobd{background:var(--orange-s);color:var(--orange);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.shell.compact{grid-template-columns:64px minmax(0,1fr)}
.shell.compact .brand div,.shell.compact .nav button span,.shell.compact .ws div,.shell.compact .me div{display:none}
.shell.compact .brand{justify-content:center}
.shell.compact .nav button{justify-content:center}
.compact-dash .card{padding:12px}
.compact-dash .kpi{padding:10px}
@media (max-width:820px){
  .setwrap{grid-template-columns:1fr}
  .setnav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding:8px;-webkit-overflow-scrolling:touch}
  .setnav button{flex:none}
}

@media (max-width:1180px){
  .dash{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:980px){
  .shell{grid-template-columns:64px minmax(0,1fr)}
  .brand div,.nav button span,.ws div,.me div,.ws>svg{display:none}
  .brand{padding:0 0 18px;justify-content:center}
  .nav button{justify-content:center;padding:12px 0}
  .side{padding:20px 8px 12px}
  .ws{justify-content:center;padding:8px 0}
  .me{justify-content:center;padding:8px 0}
  .row2,.row2b,.pd,.row2.srcrow{grid-template-columns:minmax(0,1fr)}
  .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fn::after{display:none}
  .conv{grid-column:1/-1;flex-direction:row;justify-content:center}
}
@media (max-width:640px){

  .brand,.side-foot{display:none}

  .top{padding:12px 14px;flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}

  .shell,.main,#view{min-width:0}

  .md-g{grid-template-columns:1fr}

  .tl .d{grid-column:1/-1}
  .top-r{margin-left:0;flex:1;justify-content:space-between}
  .top-r .sel{flex:1;min-width:0}
}

/* Ichki Supabase mijozi: tashqi kutubxonasiz, faqat fetch() orqali */
(function(){
"use strict";
function createClient(URL,KEY,opts){
  const SK=(opts&&opts.auth&&opts.auth.storageKey)||"sb-auth";
  const listeners=[];
  const load=()=>{try{return JSON.parse(localStorage.getItem(SK))}catch(e){return null}};
  const store=s=>{try{s?localStorage.setItem(SK,JSON.stringify(s)):localStorage.removeItem(SK)}catch(e){}};
  const emit=(ev,s)=>listeners.forEach(f=>{try{f(ev,s)}catch(e){}});
  const errOf=(j,status)=>({message:(j&&(j.message||j.msg||j.error_description||j.error))||("HTTP "+status),code:j&&(j.code||j.error_code),status});
  async function authFetch(path,body,method,token){
    let r;
    try{
      r=await fetch(URL+"/auth/v1"+path,{method:method||"POST",headers:{"apikey":KEY,"Content-Type":"application/json","Authorization":"Bearer "+(token||KEY)},body:body?JSON.stringify(body):undefined});
    }catch(e){return {error:{message:(window.__L||(s=>s))("Serverga ulanib bo'lmadi (internet yoki tarmoq bloki)")}}}
    let j=null;try{j=await r.json()}catch(e){}
    return r.ok?{data:j}:{error:errOf(j,r.status)};
  }
  const toSession=j=>({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:j.user});
  let refreshing=null;
  async function getSession(){
    let s=load();if(!s)return null;
    if(s.expires_at-60>Date.now()/1000)return s;
    if(!refreshing)refreshing=(async()=>{
      const r=await authFetch("/token?grant_type=refresh_token",{refresh_token:s.refresh_token});
      if(r.error){if(r.error.status&&r.error.status<500){store(null);emit("SIGNED_OUT",null)}return r.error.status?null:s}
      const ns=toSession(r.data);store(ns);emit("TOKEN_REFRESHED",ns);return ns;
    })().finally(()=>{setTimeout(()=>{refreshing=null},0)});
    return refreshing;
  }
  const auth={
    async getSession(){return {data:{session:await getSession()}}},
    async signInWithPassword({email,password}){
      const r=await authFetch("/token?grant_type=password",{email,password});
      if(r.error)return {data:{session:null},error:r.error};
      const s=toSession(r.data);store(s);emit("SIGNED_IN",s);return {data:{session:s,user:s.user},error:null};
    },
    async updateUser(attrs){
      const s=await getSession();if(!s)return {error:{message:"Sessiya tugagan"}};
      const r=await authFetch("/user",attrs,"PUT",s.access_token);
      return r.error?{error:r.error}:{data:{user:r.data},error:null};
    },
    async signOut(){
      const s=load();
      if(s)authFetch("/logout?scope=local",null,"POST",s.access_token).catch(()=>{});
      store(null);emit("SIGNED_OUT",null);return {error:null};
    },
    mfa:{
      async listFactors(){const s=await getSession();if(!s)return {data:[],error:{message:"no session"}};const r=await authFetch("/user",null,"GET",s.access_token);return r.error?{data:[],error:r.error}:{data:(r.data&&r.data.factors)||[],error:null}},
      async enroll(){const s=await getSession();if(!s)return {error:{message:"no session"}};return authFetch("/factors",{factor_type:"totp",friendly_name:"ClinicAnalytics "+Date.now(),issuer:"ClinicAnalytics"},"POST",s.access_token)},
      async challenge(id){const s=await getSession();if(!s)return {error:{message:"no session"}};return authFetch("/factors/"+encodeURIComponent(id)+"/challenge",{},"POST",s.access_token)},
      async verify(id,challengeId,code){
        const s=await getSession();if(!s)return {error:{message:"no session"}};
        const r=await authFetch("/factors/"+encodeURIComponent(id)+"/verify",{challenge_id:challengeId,code:String(code)},"POST",s.access_token);
        if(r.error)return r;
        if(r.data&&r.data.access_token){const ns=toSession(r.data);store(ns);emit("MFA_CHALLENGE_VERIFIED",ns)}
        return {data:r.data,error:null};
      },
      async unenroll(id){const s=await getSession();if(!s)return {error:{message:"no session"}};return authFetch("/factors/"+encodeURIComponent(id),null,"DELETE",s.access_token)}
    },
    onAuthStateChange(cb){listeners.push(cb);return {data:{subscription:{unsubscribe(){const i=listeners.indexOf(cb);if(i>=0)listeners.splice(i,1)}}}}}
  };
  async function rest(method,path,body,headers){
    const s=await getSession();
    const h=Object.assign({"apikey":KEY,"Authorization":"Bearer "+(s?s.access_token:KEY),"Content-Type":"application/json"},headers||{});
    let r;
    try{r=await fetch(URL+"/rest/v1/"+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)})}
    catch(e){return {data:null,error:{message:(window.__L||(s=>s))("Serverga ulanib bo'lmadi (internet yoki tarmoq bloki)")},count:null}}
    let count=null;const cr=r.headers.get("content-range");
    if(cr&&cr.includes("/")){const n=cr.split("/")[1];if(n!=="*")count=+n}
    let txt="";try{txt=await r.text()}catch(e){}
    let j=null;if(txt){try{j=JSON.parse(txt)}catch(e){j=txt}}
    if(!r.ok)return {data:null,error:errOf(j,r.status),count};
    return {data:j,error:null,count};
  }
  function from(table){
    const st={method:"GET",select:null,filters:[],order:[],range:null,head:false,count:null,single:false,maybe:false,body:undefined,ret:false,prefer:[],onConflict:null};
    const enc=v=>encodeURIComponent(v===null?"null":String(v));
    const b={
      select(cols,o){st.select=cols||"*";if(st.method!=="GET")st.ret=true;if(o&&o.head)st.head=true;if(o&&o.count)st.count=o.count;return b},
      eq(c,v){st.filters.push(c+"=eq."+enc(v));return b},
      order(c,o){st.order.push(c+"."+(o&&o.ascending===false?"desc":"asc"));return b},
      range(a,z){st.range=[a,z];return b},
      single(){st.single=true;return b},
      maybeSingle(){st.maybe=true;return b},
      insert(rows){st.method="POST";st.body=rows;return b},
      update(obj){st.method="PATCH";st.body=obj;return b},
      delete(){st.method="DELETE";return b},
      upsert(rows,o){st.method="POST";st.body=rows;st.onConflict=o&&o.onConflict;st.prefer.push("resolution="+(o&&o.ignoreDuplicates?"ignore":"merge")+"-duplicates");return b},
      then(res,rej){return run().then(res,rej)}
    };
    async function run(){
      const q=[];
      if(st.select&&(st.method==="GET"||st.ret))q.push("select="+encodeURIComponent(st.select));
      q.push(...st.filters);
      if(st.order.length)q.push("order="+st.order.join(","));
      if(st.onConflict)q.push("on_conflict="+encodeURIComponent(st.onConflict));
      const h={};const pref=st.prefer.slice();
      if(st.method!=="GET")pref.push(st.ret?"return=representation":"return=minimal");
      if(st.count)pref.push("count="+st.count);
      if(pref.length)h["Prefer"]=pref.join(",");
      if(st.range){h["Range-Unit"]="items";h["Range"]=st.range[0]+"-"+st.range[1]}
      if(st.single)h["Accept"]="application/vnd.pgrst.object+json";
      const method=st.head?"HEAD":st.method;
      const r=await rest(method,table+(q.length?"?"+q.join("&"):""),st.body,h);
      if(r.error)return r;
      if(st.maybe)return {data:Array.isArray(r.data)?(r.data[0]||null):r.data,error:null,count:r.count};
      return r;
    }
    return b;
  }
  async function rpc(name,args){return rest("POST","rpc/"+name,args||{},{})}
  return {from,rpc,auth};
}
window.supabase={createClient};
})();

</script>

function trDyn(s,l){
  const ru=l==="ru";let m;

  if(m=s.match(/^Rostdan ham (.+)ni o'chirmoqchimisiz\?$/))return ru?`Вы действительно хотите удалить ${m[1]}?`:`Are you sure you want to delete ${m[1]}?`;
  if(m=s.match(/^Rostdan ham (.+) filialini o'chirmoqchimisiz\?$/))return ru?`Вы действительно хотите удалить филиал ${m[1]}?`:`Are you sure you want to delete the ${m[1]} branch?`;
  if(m=s.match(/^Filial qo'shildi: (.+)$/))return ru?`Филиал добавлен: ${m[1]}`:`Branch added: ${m[1]}`;
  if(m=s.match(/^Filial o'chirildi: (.+)$/))return ru?`Филиал удалён: ${m[1]}`:`Branch deleted: ${m[1]}`;
  if(m=s.match(/^Bemor o'chirildi: (.+)$/))return ru?`Пациент удалён: ${m[1]}`:`Patient deleted: ${m[1]}`;
  if(m=s.match(/^Tashrif qo'shildi: (.+)$/))return ru?`Визит добавлен: ${m[1]}`:`Visit added: ${m[1]}`;
  if(m=s.match(/^Doktor qo'shildi: (.+)$/))return ru?`Врач добавлен: ${m[1]}`:`Doctor added: ${m[1]}`;
  if(m=s.match(/^Doktor o'chirildi: (.+)$/))return ru?`Врач удалён: ${m[1]}`:`Doctor deleted: ${m[1]}`;
  if(m=s.match(/^Doktor yangilandi: (.+)$/))return ru?`Врач обновлён: ${m[1]}`:`Doctor updated: ${m[1]}`;
  if(m=s.match(/^Bemor qo'shildi: (.+)$/))return ru?`Пациент добавлен: ${m[1]}`:`Patient added: ${m[1]}`;
  if(m=s.match(/^(.+) filiali tanlandi$/))return ru?`Выбран филиал: ${m[1]}`:`Branch selected: ${m[1]}`;
  if(m=s.match(/^O'chirmoqchimisiz: (.+)\? Uning (\d+) ta bemori (.+) doktoriga o'tkaziladi\.$/))return ru?`Удалить врача ${m[1]}? Его пациенты (${m[2]}) будут переданы врачу ${m[3]}.`:`Delete ${m[1]}? Their ${m[2]} patients will be reassigned to ${m[3]}.`;
  if(m=s.match(/^Faylni saqlab bo'lmadi(.*)$/))return (ru?"Не удалось сохранить файл":"Could not save the file")+m[1];
  if(m=s.match(/^(.+) — (.+) bo'limida$/))return tr(m[1])+" — "+tr(m[2])+(ru?" (раздел)":" (section)");
  if(m=s.match(/^Bazaga saqlanmadi: (.+)$/))return (ru?"Не сохранено в базе: ":"Not saved to the database: ")+m[1];
  if(m=s.match(/^Fayldagi barcha ma'lumotlar bazaga ko'chiriladi\. Davom etasizmi\?$/))return ru?"Все данные из файла будут перенесены в базу. Продолжить?":"All data from the file will be copied into the database. Continue?";
  return s;
}

function deepMerge(base,over){

  if(base&&typeof base==="object"){const o=Object.assign({},base);if(over&&typeof over==="object")Object.keys(over).forEach(k=>{o[k]=k in base?deepMerge(base[k],over[k]):over[k]});return o}

}

async function deflateRaw(u8){
  if(typeof CompressionStream==="undefined")return null;
  try{const cs=new CompressionStream("deflate-raw");const buf=await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer();return new Uint8Array(buf)}catch(e){return null}
}
async function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  for(const f of files){
    const nm=enc.encode(f.name),raw=enc.encode(f.data),crc=crc32(raw);
    let comp=await deflateRaw(raw),method=8;
    if(!comp||comp.length>=raw.length){comp=raw;method=0}
    const lh=new Uint8Array([0x50,0x4B,3,4,20,0,0,8,...u16(method),0,0,0x21,0,...u32(crc),...u32(comp.length),...u32(raw.length),...u16(nm.length),0,0]);
    parts.push(lh,nm,comp);
    cd.push({nm,crc,clen:comp.length,len:raw.length,off,method});
    off+=lh.length+nm.length+comp.length;
  }
  const cdParts=[];let cdLen=0;
  cd.forEach(e=>{
    const h=new Uint8Array([0x50,0x4B,1,2,20,0,20,0,0,8,...u16(e.method),0,0,0x21,0,...u32(e.crc),...u32(e.clen),...u32(e.len),...u16(e.nm.length),0,0,0,0,0,0,0,0,...u32(0),...u32(e.off)]);
    cdParts.push(h,e.nm);cdLen+=h.length+e.nm.length;
  });
  const end=new Uint8Array([0x50,0x4B,5,6,0,0,0,0,...u16(cd.length),...u16(cd.length),...u32(cdLen),...u32(off),0,0]);
  return new Blob([...parts,...cdParts,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xlsxCol(n){let s="";n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function xmlEsc(s){return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
async function makeXlsx(rows,sheetName){
  const isBlank=r=>!r.length||r.every(x=>x===""||x==null);
  const boldRow=(r,i)=>!isBlank(r)&&(i===0||isBlank(rows[i-1]))&&r.every(x=>typeof x==="string"||x==null);
  const widths=[];
  rows.forEach(r=>{if(r.filter(x=>x!==""&&x!=null).length<2)return;r.forEach((x,k)=>{const l=String(x==null?"":x).length;widths[k]=Math.max(widths[k]||8,Math.min(l+2,48))})});
  const cols=widths.length?`<cols>${widths.map((w,k)=>`<col min="${k+1}" max="${k+1}" width="${w}" customWidth="1"/>`).join("")}</cols>`:"";
  const body=rows.map((r,i)=>{
    const b=boldRow(r,i);
    return `<row r="${i+1}">${r.map((x,k)=>{
      if(x===""||x==null)return "";
      const ref=xlsxCol(k)+(i+1);
      if(typeof x==="number"&&isFinite(x))return `<c r="${ref}"${b?' s="1"':""}><v>${x}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${b?' s="1"':""}><is><t xml:space="preserve">${xmlEsc(x)}</t></is></c>`;
    }).join("")}</row>`;
  }).join("");
  const freeze=(rows[0]&&rows[0].length>=5)?'<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>':"";
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${freeze}${cols}<sheetData>${body}</sheetData></worksheet>`;
  const nm=xmlEsc((sheetName||"Sheet1").replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31)||"Sheet1");
  const files=[
   {name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
   {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
   {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${nm}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
   {name:"xl/_rels/workbook.xml.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
   {name:"xl/styles.xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE9F0FF"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
   {name:"xl/worksheets/sheet1.xml",data:sheet}
  ];
  return await zipStore(files);
}

let JSPDF_LOAD=null,AUTOTABLE_LOAD=null;
function loadJsPDF(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(window.jspdf.jsPDF);
  if(JSPDF_LOAD)return JSPDF_LOAD;
  JSPDF_LOAD=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>{if(window.jspdf&&window.jspdf.jsPDF)res(window.jspdf.jsPDF);else rej(new Error("jsPDF topilmadi"))};
    s.onerror=()=>rej(new Error("jsPDF yuklanmadi"));
    document.head.appendChild(s);
  });
  return JSPDF_LOAD;
}
function loadAutoTable(){
  if(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API&&window.jspdf.jsPDF.API.autoTable)return Promise.resolve();
  if(AUTOTABLE_LOAD)return AUTOTABLE_LOAD;
  AUTOTABLE_LOAD=loadJsPDF().then(()=>new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js";
    s.onload=()=>res();
    s.onerror=()=>rej(new Error("autoTable yuklanmadi"));
    document.head.appendChild(s);
  }));
  return AUTOTABLE_LOAD;
}

const pad2=n=>String(n).padStart(2,"0");
function timeParts(){const d=new Date(NOW);return {hm:pad2(d.getHours())+":"+pad2(d.getMinutes()),s:":"+pad2(d.getSeconds())}}
function liveCard(){
  const base=PB(),tp=timeParts(),now=new Date(NOW),mi=monthIdxOf(NOW);
  const today=base.filter(p=>sameDay(p.ts,NOW));
  const todayDone=today.filter(p=>(p.svcs||[]).includes("EVLO")).length;
  const curM=base.filter(p=>p.mi===mi&&p.ts<=NOW);
  let cd=now.getDate();
  if(curM.length){const ld=new Date(Math.max(...curM.map(p=>p.ts))).getDate();if(ld<cd)cd=ld}
  const prevSame=base.filter(p=>p.mi===mi-1&&new Date(p.ts).getDate()<=cd).length;
  const cur=curM.length,delta=prevSame?(cur-prevSame)/prevSame*100:null;
  const avg=cd?cur/cd:0;
  const lastTs=base.reduce((m,p)=>Math.max(m,p.ts),0);
  const sod=ts=>{const d=new Date(ts);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
  const ago=lastTs?Math.round((sod(NOW)-sod(lastTs))/864e5):0;
  const tz=(store.settings.region&&store.settings.region.tz)||"Asia/Tashkent";
  const chip=delta==null?"":`<span class="lv-chip" title="${esc(tr("o'tgan oyning shu davriga nisbatan"))}">${delta>=0?"▲":"▼"} ${Math.abs(delta).toFixed(0)}%</span>`;
  const mLbl=mi>=0&&mi<MONTHS.length?monthLbl(mi):"";
  return `<div class="card live">
    <div class="lv-top"><span class="live-pill"><i class="live-dot"></i>${tr("Jonli")}</span><span id="lvTz">${esc(tz)}</span></div>
    <div class="lv-time"><span id="lvTime">${tp.hm}</span><small id="lvSec">${tp.s}</small></div>
    <div class="lv-date" id="lvDate">${weekdayName(now.getDay())}, ${dateLong(NOW)}</div>
    <div class="lv-stats"><div><b>${today.length}</b><span>${tr("Bugun")} · ${tr("Bemorlar")}</span></div><div><b>${todayDone}</b><span>${tr("Bugun")} · ${tr("Operatsiya")}</span></div></div>
    <div class="lv-month"><div><div class="lv-mt">${tr("Shu oy")}: <b>${fmt(cur)}</b></div><div class="lv-ms">${mLbl} · ${tr("Bemorlar")} · ${tr("Kunlik o'rtacha").toLowerCase()} ${avg.toFixed(1)}</div></div>${chip}</div>
    ${delta==null?"":`<div class="lv-ms" style="margin-top:8px;padding:0 2px;line-height:1.5">${tr("o'tgan oyning shu davriga nisbatan")}:<br>${monthName(mi-1)} 1–${cd}: <b>${fmt(prevSame)}</b> → ${monthName(mi)} 1–${cd}: <b>${fmt(cur)}</b></div>`}

function filtered(){
  const q=S.q.trim().toLowerCase().replace(/\s+/g," "),qd=q.replace(/\D/g,"");
  return scoped().filter(p=>{
    if(S.fBr&&p.br!==S.fBr)return false;
    if(S.fSrc&&p.src!==S.fSrc)return false;
    if(S.fSt!==""&&!((p.svcs||[]).includes(S.fSt)))return false;
    if(S.fDoc&&p.doc!==S.fDoc)return false;
    if(q){
      const isId=/^p-?\d+$/.test(q),hasLetters=/[a-zа-яё]/i.test(q);
      const hit=isId?String(p.id)===q.replace(/^p-?0*/,""):(p.name.toLowerCase().replace(/\s+/g," ").includes(q)||String(p.id)===q||(!hasLetters&&qd.length>=3&&p.phone.replace(/\D/g,"").includes(qd)));
      if(!hit)return false;
    }
    return true;
  }).sort((a,b)=>b.ts-a.ts||b.id-a.id);
}

function pageList(cur,n){
  const s=new Set([1,n,cur,cur-1,cur+1]);const a=[...s].filter(x=>x>=1&&x<=n).sort((x,y)=>x-y);const out=[];
  a.forEach((x,i)=>{if(i&&x-a[i-1]>1)out.push("…");out.push(x)});return out;
}

const PERM_KEYS=()=>{const k=[];PERM_GROUPS.forEach(g=>g[2].forEach(a=>k.push(g[0]+"."+a)));return k};
function roleDefaultPerms(role){const src=(store.settings.perms&&store.settings.perms[role])||{},o={};PERM_KEYS().forEach(k=>o[k]=!!src[k]);return o}
function readUserPerms(){const o={};PERM_KEYS().forEach(k=>o[k]=false);document.querySelectorAll("[data-uperm]").forEach(c=>{o[c.dataset.uperm]=c.checked});return o}
function renderUserPerms(initial,perms){
  const area=$("#upermArea");if(!area)return;

  def.parentElement.style.display="";

const AUD={key:null,data:null,loading:false,err:null,page:0,f:{t:"",a:"",u:"",from:"",to:""}};
const AUD_PAGE=50;
const AUD_TABLES=[["patients","Bemorlar"],["visits","Tashriflar"],["payments","To'lovlar"],["branches","Filiallar"],["doctors","Doktorlar"],["managers","Menejerlar"],["sources","Manbalar"],["profiles","Foydalanuvchilar"],["role_permissions","Ruxsatlar"],["app_settings","Sozlamalar"],["backups","Zaxira nusxa"]];

const AUD_FIELDS={full_name:"Ism",phone:"Telefon",birth_date:"Tug'ilgan sana",birth_year:"Tug'ilgan yil",gender:"Jinsi",note:"Izoh",visit_date:"Sana",service:"Xizmat turi",branch_id:"Filial",doctor_id:"Doktor",manager_id:"Menejer",source_id:"Manba",patient_id:"Bemor",fail_stage:"Bosqich",amount:"Summa",method:"To'lov turi",paid_at:"To'lov sanasi",name:"Nomi",manager_name:"Menejer",active:"Faol",role:"Rol",perms:"Ruxsatlar",allowed:"Ruxsat",avatar:"Rasm",prefs:"Shaxsiy sozlamalar",position:"Lavozim",contact_email:"Email",email:"Email",username:"Login",deleted_at:"O'chirilgan sana",specialty:"Mutaxassislik",work_from:"Ish boshlanishi",work_to:"Ish tugashi",work_days:"Ish kunlari",main_branch_id:"Asosiy filial",sort_order:"Tartib",logo:"Logo",address:"Manzil",wf:"Ish boshlanishi",wt:"Ish tugashi",target_total:"Oylik maqsad: bemorlar",target_evlo:"Oylik maqsad: EVLO",created_by:"Kim qo'shgan"};
const UUIDRE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function audName(map,id){const ids=(window.DBX&&window.DBX.ids)||{},m=ids[map]||{};return Object.keys(m).find(k=>m[k]===id)||null}
function audVal(f,v){
  if(v==null||v==="—")return "—";
  v=String(v);
  if(f==="branch_id"||f==="main_branch_id")return audName("br",v)||"—";
  if(f==="doctor_id")return audName("doc",v)||"—";
  if(f==="manager_id")return mgrLbl(audName("mgr",v)||"—");
  if(f==="source_id"){const n=audName("src",v);return n?srcLabel(n):"—"}
  if(f==="created_by"||f==="patient_id"||UUIDRE.test(v)){const p=(window.__PROFILES||[]).find(x=>x.id===v);return p?(p.full_name||p.username):"…"}
  if(f==="service"){const k=["consultation","examination","evlo","sclerotherapy","derma_v","klaks","cancelled"].indexOf(v);return k>=0?tr(["Konsultatsiya","Ko'rik","EVLO","Skleroterapiya","Derma V","Klaks","Qabul bekor qilindi"][k]):v}
  if(f==="gender")return v==="female"?tr("Ayol"):v==="male"?tr("Erkak"):v;
  if(f==="method")return v==="card"?tr("Karta"):v==="cash"?tr("Naqd"):v;
  if(f==="role")return tr(({super_admin:"Super Admin",admin:"Admin",doctor:"Doktor"})[v]||v);
  if(v==="true")return tr("Ha");if(v==="false")return tr("Yo'q");
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return fd(Date.parse(v+"T00:00:00"));
  if(/^\d{4}-\d{2}-\d{2}T/.test(v)&&!isNaN(Date.parse(v)))return ft(Date.parse(v));
  return v.length>60?v.slice(0,60)+"…":v;
}
function audKey(){return JSON.stringify([AUD.f,AUD.page])}
function loadAudit(force){
  if(AUD.loading)return;
  const k=audKey();if(!force&&AUD.key===k)return;
  AUD.loading=true;AUD.key=k;
  const f=AUD.f;
  window.DBX.auditFeed({p_table:f.t||null,p_action:f.a||null,p_user:f.u||null,p_from:f.from||null,p_to:f.to||null,p_limit:AUD_PAGE,p_offset:AUD.page*AUD_PAGE})
    .then(d=>{AUD.data=d||{total:0,rows:[]};AUD.err=null}).catch(e=>{AUD.data=null;AUD.err=String((e&&e.message)||e)})
    .finally(()=>{AUD.loading=false;if(S.view==="settings"&&S.stab==="audit")render()});
}
function audLabel(r){
  if(r.table==="app_settings")return r.record==="clinic"?tr("Klinika ma'lumotlari"):r.record==="analytics"?tr("Oylik maqsadlar"):r.label;
  if(r.table==="backups")return tr("Zaxira nusxa")+" №"+r.record;
  if(r.table==="role_permissions"){const m=String(r.label||"").split(" · ");return tr(({super_admin:"Super Admin",admin:"Admin",doctor:"Doktor"})[m[0]]||m[0])+(m[1]?" · "+m[1]:"")}
  if(r.table==="visits"&&/^\d{4}-\d{2}-\d{2}$/.test(r.label||""))return tr("Tashrif")+" · "+fd(Date.parse(r.label+"T00:00:00"));
  if(UUIDRE.test(r.label||""))return "—";
  return r.label||"—";
}
function audDetails(r){
  if(r.action==="RESTORE")return esc(tr("Tiklashdan oldingi holat alohida zaxira nusxa sifatida saqlangan"));
  const ch=r.changes||[];if(!ch.length)return "—";
  const show=ch.slice(0,4).map(c=>{
    const nm=AUD_FIELDS[c.f]?tr(AUD_FIELDS[c.f]):c.f;
    if(c.f==="perms"||c.f==="prefs"||c.f==="avatar"||c.f==="logo")return `<div><b>${esc(nm)}</b>: ${esc(tr("o'zgartirildi"))}</div>`;
    return `<div><b>${esc(nm)}</b>: <span class="muted">${esc(audVal(c.f,c.o))}</span> → ${esc(audVal(c.f,c.n))}</div>`;
  }).join("");
  return show+(ch.length>4?`<div class="muted">+${ch.length-4}</div>`:"");
}
function setAudit(){

    <label class="aud-d">${esc(tr("dan"))}<input type="date" id="audFrom" value="${esc(f.from)}"></label>
    <label class="aud-d">${esc(tr("gacha"))}<input type="date" id="audTo" value="${esc(f.to)}"></label>
    ${(f.t||f.a||f.u||f.from||f.to)?`<button class="btn sm" data-act="aud-clear">${ic("x",14)}${esc(tr("Tozalash"))}</button>`:""}
    <button class="btn sm" data-act="aud-reload" aria-label="${esc(tr("Yangilash"))}">${ic("refresh",14)}${esc(tr("Yangilash"))}</button></div>`;
  let body;
  if(AUD.err&&!AUD.loading)body=`<tr><td colspan="6" class="empty">${esc(tr("Audit jurnalini yuklab bo'lmadi"))}: ${esc(AUD.err)}</td></tr>`;
  else if(!d)body=`<tr><td colspan="6" class="empty">${esc(tr("Yuklanmoqda…"))}</td></tr>`;
  else body=d.rows.map(r=>{const ac=AUD_ACTIONS.find(x=>x[0]===r.action)||[r.action,r.action,"st0"];const tb=AUD_TABLES.find(x=>x[0]===r.table);
    return `<tr><td style="white-space:nowrap">${ft(Date.parse(r.at))}</td><td>${esc(r.user||tr("Tizim"))}</td><td><span class="bd ${ac[2]}">${esc(tr(ac[1]))}</span></td><td>${esc(tb?tr(tb[1]):r.table)}</td><td style="white-space:normal;min-width:140px">${esc(audLabel(r))}</td><td class="aud-ch">${audDetails(r)}</td></tr>`}).join("")||`<tr><td colspan="6" class="empty">${t("no_records")}</td></tr>`;
  const tot=d?+d.total||0:0,from=tot?AUD.page*AUD_PAGE+1:0,to=Math.min(tot,(AUD.page+1)*AUD_PAGE);
  const pager=d?`<div class="aud-p"><span class="muted">${fmt(from)}–${fmt(to)} / ${fmt(tot)}</span><span class="sp"></span><button class="btn sm" data-act="aud-prev" ${AUD.page<=0||AUD.loading?"disabled":""}>${ic("left",14)}${esc(tr("Oldingi"))}</button><button class="btn sm" data-act="aud-next" ${to>=tot||AUD.loading?"disabled":""}>${esc(tr("Keyingi"))}${ic("right",14)}</button></div>`:"";
  return `<div class="tb" style="margin-bottom:2px"><h2 style="margin:0">${t("audit_log_title")}</h2>${AUD.loading&&d?`<span class="muted" style="font-size:12.5px">${esc(tr("Yuklanmoqda…"))}</span>`:""}</div>
  <p class="sub" style="margin:4px 0 10px">${esc(tr("Bazadagi har bir o'zgarish avtomatik yoziladi: kim, qachon va nimani o'zgartirgani. Bu yozuvlarni hech kim tahrirlay yoki o'chira olmaydi."))}</p>

const phKey=s=>{let d=String(s||"").replace(/\D/g,"");if(d.length>9&&d.startsWith("998"))d=d.slice(3);return d.length>=9?d.slice(-9):""};
function renderPhoneHit(){
  const box=$("#phHit");if(!box)return;
  const key=phKey($("#ph").value);
  if(_addFrom&&phKey(_addFrom.phone)!==key){_addFrom=null;const h=$("#md h2");if(h)h.textContent=tr("Yangi bemor qo'shish")}
  if(!key||(_addFrom&&phKey(_addFrom.phone)===key)){box.innerHTML=_addFrom?`<div class="phhit ok">✓ ${tr("Bemor ma'lumotlari to'ldirildi")}</div>`:"";return}
  const hits=P.filter(p=>phKey(p.phone)===key);

  const groups=new Map();hits.forEach(p=>{const k=p.name.trim().toLowerCase();const g=groups.get(k)||[];g.push(p);groups.set(k,g)});
  box.innerHTML=[...groups.values()].slice(0,3).map(g=>{const last=g.reduce((a,b)=>b.ts>a.ts||(b.ts===a.ts&&b.id>a.id)?b:a);
    return `<div class="phhit"><span>⚠ ${tr("Bu raqam bilan bemor mavjud")}: <b>${esc(last.name)}</b> · ${g.length} ${tr("ta tashrif")} · ${tr("oxirgi")}: ${fd(last.ts)}</span><button type="button" class="btn sm" data-act="link-visit" data-id="${last.id}">${tr("Shu bemorga yangi tashrif qo'shish")}</button></div>`}).join("");

async function fetchAllVisits(){
  const r=await sb.rpc("app_visits_compact");
  if(r.error){
    const m=String(r.error.message||"");
    if(r.error.code==="PGRST202"||/Could not find the function|schema cache/i.test(m))return fetchAllVisitsPaged();
    throw r.error;
  }
  const d=r.data||{},P=d.p||[],R=d.r||{},ref=(a,i)=>i==null?null:((a||[])[i]||null);
  return (d.v||[]).map(a=>{
    const pt=a[1]==null?null:P[a[1]],pays=[];
    if(+a[10]>0)pays.push({method:"card",amount:+a[10]});
    if(+a[11]>0)pays.push({method:"cash",amount:+a[11]});
    return {id:a[0],patient_id:pt?pt[0]:null,visit_date:a[2],service:a[3],fail_stage:a[4],
      branch_id:ref(R.b,a[5]),doctor_id:ref(R.d,a[6]),manager_id:ref(R.m,a[7]),source_id:ref(R.s,a[8]),note:a[9],
      patients:pt?{full_name:pt[1],phone:pt[2],birth_date:pt[3],birth_year:pt[4],gender:pt[5]}:null,payments:pays};
  });
}
async function fetchAllVisitsPaged(){
  const out=[],N=1000;
  for(let from=0;;from+=N){
    const rows=await ok(sb.from("visits")
      .select("id,patient_id,visit_date,service,fail_stage,branch_id,doctor_id,manager_id,source_id,note,created_at,patients(full_name,phone,birth_date,birth_year,gender),payments(method,amount)")
      .order("visit_date",{ascending:true}).order("created_at",{ascending:true}).order("id",{ascending:true})
      .range(from,from+N-1));
    out.push(...rows);
    if(rows.length<N)break;
  }
  return out;
}

    ok(sb.from("doctors").select("id,full_name,specialty,phone,work_from,work_to,work_days,main_branch_id").order("created_at").order("full_name")),
    ok(sb.from("doctor_branches").select("doctor_id,branch_id")),
    ok(sb.from("managers").select("id,full_name").order("created_at").order("full_name")),
    ok(sb.from("sources").select("id,name,sort_order").order("sort_order")),
    ok(sb.from("role_permissions").select("role,permission,allowed")),
    me.role==="super_admin"?ok(sb.from("profiles").select("id,full_name,email,username,role,doctor_id,branch_id,active,created_at,perms,deleted_at").order("created_at")):Promise.resolve([me]),

  const appset={},appsetAt={};
  ((aps&&!aps.error&&aps.data)||[]).forEach(r=>{appset[r.key]=r.value&&typeof r.value==="object"?r.value:{};appsetAt[r.key]=r.updated_at});
  const st=(live&&!live.error&&live.data)||{};
  const mfaMap={};((mfa&&mfa.data)||[]).forEach(x=>{mfaMap[x.user_id]=!!x.enabled});
  window.__MFAMAP=mfaMap;window.__RAWPERMS=perms;
  const secOk=st.live!==false&&!(st.enrolled&&st.aal!=="aal2")&&!(st.required&&!st.enrolled);
  return {branches,doctors,dbr,managers,sources,perms,profiles,visits,meNow,live:st.live!==false,secOk,appset,appsetAt,ver:(dver&&!dver.error)?dver.data:null};

function buildXL(D){
  IDS.br={};IDS.doc={};IDS.src={};IDS.mgr={};
  const brById={},docById={},srcById={},mgrById={};
  D.branches.forEach(b=>{IDS.br[b.name]=b.id;brById[b.id]=b.name});
  D.doctors.forEach(d=>{IDS.doc[d.full_name]=d.id;docById[d.id]=d.full_name});
  D.sources.forEach(s=>{IDS.src[s.name]=s.id;srcById[s.id]=s.name});
  D.managers.forEach(m=>{IDS.mgr[m.full_name]=m.id;mgrById[m.id]=m.full_name});
  const hm=t=>t?String(t).slice(0,5):"";
  const docs=D.doctors.map(d=>{
    const own=D.dbr.filter(x=>x.doctor_id===d.id).map(x=>brById[x.branch_id]).filter(Boolean);
    const main=brById[d.main_branch_id]||own[0]||"";
    const brs=main?[main,...own.filter(b=>b!==main)]:own;
    return {n:d.full_name,s:d.specialty||"—",b:main,brs,phone:d.phone||"",wf:hm(d.work_from),wt:hm(d.work_to),wd:d.work_days||""};
  });
  const mgrNames=D.managers.map(m=>m.full_name);
  const rows=D.visits.map(v=>{
    const p=v.patients||{};let card=0,cash=0;
    (v.payments||[]).forEach(x=>{if(x.method==="card")card+=+x.amount;else cash+=+x.amount});
    return {vid:v.id,pid:v.patient_id,name:p.full_name||"—",phone:p.phone||"",
      src:srcById[v.source_id]||(D.sources[0]?D.sources[0].name:""),br:brById[v.branch_id]||"",
      doc:docById[v.doctor_id]||"—",mgr:mgrById[v.manager_id]||"—",date:v.visit_date,
      svc:SVC_NAMES[SVC_ENUM.indexOf(v.service)]||"",fail:v.fail_stage||null,
      gender:p.gender==="female"?"F":p.gender==="male"?"M":null,bd:p.birth_date||null,by:p.birth_year||null,
      note:v.note||"",card,cash};
  });
  /* oylar oralig'i */
  const now=new Date();let minY=now.getFullYear(),minM=now.getMonth(),maxI=0;
  if(rows.length){const a=rows[0].date;minY=+a.slice(0,4);minM=+a.slice(5,7)-1}
  rows.forEach(r=>{const i=(+r.date.slice(0,4)-minY)*12+(+r.date.slice(5,7)-1)-minM;if(i>maxI)maxI=i});
  return {XL:{br:D.branches.map(b=>b.name),brmgr:D.branches.map(b=>b.manager_name||""),docs,mgr:mgrNames,src:D.sources.map(s=>s.name),rows},
          START:{y:minY,m:minM},LASTIDX:maxI};
}
function makeAcc(prof){
  const brName=prof.branch_id?(Object.keys(IDS.br).find(k=>IDS.br[k]===prof.branch_id)||null):null;
  const docName=prof.doctor_id?(Object.keys(IDS.doc).find(k=>IDS.doc[k]===prof.doctor_id)||null):null;
  return {u:prof.username||window.__EMAIL,p:"",name:prof.full_name||prof.username||window.__EMAIL,role:ROLE_MAP[prof.role]||"Doktor",
    doc:prof.role==="doctor"?docName:null,br:brName,email:window.__EMAIL,id:prof.id,perms:prof.role==="super_admin"?null:(prof.perms||null),phone:prof.phone||"",position:prof.position||"",contactEmail:prof.contact_email||"",avatar:prof.avatar||"",prefs:prof.prefs||null};
}

const qrSrc=q=>{if(!q)return "";const p="data:image/svg+xml;utf-8,";return q.indexOf(p)===0?"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(q.slice(p.length)):q};
const mfaErrText=e=>{const m=String((e&&e.message)||e||"");if(/invalid|expired|code/i.test(m))return L("Kod noto'g'ri. Ilovadagi yangi kodni kiriting.");if(/rate/i.test(m))return L("Juda ko'p urinish. Birozdan keyin qayta urinib ko'ring.");return m};
async function mfaVerified(){const f=await sb.auth.mfa.listFactors();if(f.error)throw f.error;return f.data.filter(x=>x.status==="verified"&&(x.factor_type||"totp")==="totp")}
async function mfaVerifyCode(id,code){const c=await sb.auth.mfa.challenge(id);if(c.error)throw c.error;const v=await sb.auth.mfa.verify(id,c.data.id,code);if(v.error)throw v.error;return true}
async function mfaEnrollStart(){
  const f=await sb.auth.mfa.listFactors();if(f.error)throw f.error;
  for(const x of f.data.filter(x=>x.status!=="verified")){try{await sb.auth.mfa.unenroll(x.id)}catch(e){}}
  const e=await sb.auth.mfa.enroll();if(e.error)throw e.error;
  const sec=(e.data.totp&&e.data.totp.secret)||"";
  const who=(window.__ME&&window.__ME.username)||String(window.__EMAIL||"").split("@")[0]||"user";
  const uri=sec?("otpauth://totp/ClinicAnalytics:"+encodeURIComponent(who)+"?secret="+encodeURIComponent(sec)+"&issuer=ClinicAnalytics&algorithm=SHA1&digits=6&period=30"):((e.data.totp&&e.data.totp.uri)||"");
  return {id:e.data.id,qr:qrSrc(e.data.totp&&e.data.totp.qr_code),secret:sec,uri};
}
const escH=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const codeInput=id=>`<input id="${id}" inputmode="numeric" autocomplete="one-time-code" maxlength="20" placeholder="••••••" style="text-align:center;letter-spacing:8px;font-size:22px;font-weight:700">`;
function renderEnroll(host,opts){
  host.innerHTML=`<div class="mfa-wrap">${opts.forced?`<p class="sub" style="margin:0 0 12px;color:var(--text,#0F1B33)"><b>${L("Rolingiz uchun ikki bosqichli tasdiqlash majburiy. Davom etish uchun uni hozir yoqing.")}</b></p>`:""}<p class="sub" style="margin:0 0 6px">${L("1. Telefoningizga Google Authenticator (yoki Microsoft Authenticator) ilovasini o'rnating.")}</p><p class="sub" style="margin:0 0 10px">${L("2. Ilovada «+» tugmasini bosib, shu QR-kodni skanerlang.")}</p><div class="mfa-qr" style="display:grid;place-items:center;min-height:200px;background:#fff;border-radius:12px;border:1px solid var(--line,#E6EAF2);margin-bottom:8px"><span class="sub">${L("QR-kod tayyorlanmoqda…")}</span></div><p class="sub" style="margin:0 0 4px;font-size:12px">${L("Skaner qilib bo'lmasa, ilovaga shu kalitni qo'lda kiriting:")}</p><code class="mfa-secret" style="display:block;word-break:break-all;font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--gray-s,#F1F4F9);margin-bottom:12px">…</code><p class="sub" style="margin:0 0 6px">${L("3. Ilovada chiqqan 6 xonali kodni pastga yozing.")}</p><div class="field" style="margin-bottom:8px">${codeInput("mfaNewCode")}</div><div class="err mfa-err" style="margin-bottom:8px"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn mfa-cancel">${opts.forced?L("Boshqa hisob bilan kirish"):L("Bekor qilish")}</button><button type="button" class="btn pri mfa-ok" disabled>${L("Yoqish")}</button></div></div>`;
  const q=s=>host.querySelector(s),err=m=>{const e=q(".mfa-err");e.textContent=m||"";e.classList.toggle("on",!!m)};
  let fid=null,busyNow=false;
  q(".mfa-cancel").onclick=()=>opts.onCancel&&opts.onCancel();
  mfaEnrollStart().then(d=>{fid=d.id;let qrHtml="";try{if(window.__QR&&d.uri)qrHtml=window.__QR.svg(d.uri,200)}catch(x){qrHtml=""}if(!qrHtml&&d.qr)qrHtml=`<img alt="QR" src="${escH(d.qr)}" style="width:200px;height:200px">`;q(".mfa-qr").innerHTML=qrHtml;q(".mfa-secret").textContent=d.secret;q(".mfa-ok").disabled=false;q("#mfaNewCode").focus()})
    .catch(e=>{q(".mfa-qr").innerHTML="";err(L("2FA ni yoqib bo'lmadi: ")+mfaErrText(e))});
  const go=async()=>{
    if(!fid||busyNow)return;const code=q("#mfaNewCode").value.replace(/\D/g,"");
    if(code.length!==6){err(L("6 xonali kodni kiriting"));return}
    busyNow=true;q(".mfa-ok").disabled=true;q(".mfa-ok").textContent=L("Tekshirilmoqda…");err("");
    try{await mfaVerifyCode(fid,code);opts.onDone&&opts.onDone()}
    catch(e){err(mfaErrText(e));q("#mfaNewCode").value="";q("#mfaNewCode").focus()}
    finally{busyNow=false;const b=q(".mfa-ok");if(b){b.disabled=false;b.textContent=L("Yoqish")}}
  };
  q(".mfa-ok").onclick=go;q("#mfaNewCode").addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();go()}});
  q("#mfaNewCode").addEventListener("input",ev=>{ev.target.value=ev.target.value.replace(/\D/g,"").slice(0,6);if(ev.target.value.length===6)go()});
}
window.__MFA_ENROLL_UI=renderEnroll;

async function securityState(){const r=await sb.rpc("my_security_state");if(r.error)throw r.error;return r.data||{}}

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin();return}
  $("#loginWrap").classList.add("restoring");busy(true,L("Ma'lumotlar yuklanmoqda…"));
  try{
    const prof=await ok(sb.from("profiles").select("id,full_name,email,username,role,doctor_id,branch_id,active,perms,phone,position,contact_email,avatar,prefs").eq("id",session.user.id).maybeSingle());
    if(!prof||!prof.active){
      await sb.auth.signOut();showLogin();
      loginMsg(L("Hisobingiz hali faollashtirilmagan. Administrator tasdiqlashini kuting."));
      return;
    }
    const sst=await securityState();
    if(sst.live===false){await sb.auth.signOut();showLogin();loginMsg(L("Seansingiz yakunlangan. Qaytadan kiring."),true);return}
    if(sst.enrolled&&sst.aal!=="aal2"){showCodeStep();return}
    if(sst.required&&!sst.enrolled){showForcedEnroll();return}
    window.__ME=prof;window.__UID=session.user.id;window.__EMAIL=session.user.email;
    const D=await loadAll();
    const B=buildXL(D);
    window.__XL=B.XL;window.__START=B.START;window.__LASTIDX=B.LASTIDX;window.__PROFILES=D.profiles;
    window.__APPSET=D.appset;window.__APPSET_AT=D.appsetAt;window.__DVER=D.ver;lastFull=Date.now();
    window.__EMPTY_SA=prof.role==="super_admin"&&!D.visits.length;
    if(!window.__CA_STARTED){
      window.__CA_STARTED=true;
      (new Function($("#appMain").textContent))();
    }
    lastLoad=Date.now();
    busy(false);
    window.__CA_BOOT(makeAcc(prof),D.perms);
  }catch(err){
    console.error(err);showLogin();
    loginMsg(L("Ma'lumotlarni yuklab bo'lmadi: ")+(err.message||err),true);
  }
}
async function refresh(force){
  if(refreshing||!window.__CA_STARTED||!window.__ME)return;
  if(!force&&(document.visibilityState!=="visible"||document.querySelector("#ov.on")))return;
  refreshing=true;
  try{
    await DBX.q;
    /* arzon tekshiruv: bazada hech narsa o'zgarmagan bo'lsa, hammasini qayta yuklamaymiz */
    if(!force&&window.__DVER!=null&&Date.now()-lastFull<600000){
      const [st,ver]=await Promise.all([sb.rpc("my_security_state"),sb.rpc("data_version")]);
      const s=(st&&!st.error&&st.data)||null;
      if(s&&s.live===false){await sb.auth.signOut();location.reload();return}
      if(s&&((s.enrolled&&s.aal!=="aal2")||(s.required&&!s.enrolled))){location.reload();return}
      if(s&&ver&&!ver.error&&ver.data!=null&&String(ver.data)===String(window.__DVER)){lastLoad=Date.now();return}
    }
    const D=await loadAll();const B=buildXL(D);
    if(B.START.y!==window.__START.y||B.START.m!==window.__START.m){location.reload();return}
    window.__PROFILES=D.profiles;window.__LASTIDX=B.LASTIDX;window.__APPSET=D.appset;window.__APPSET_AT=D.appsetAt;window.__DVER=D.ver;lastFull=Date.now();
    if(!D.live){await sb.auth.signOut();location.reload();return}
    if(!D.secOk){location.reload();return}
    if(!D.meNow||!D.meNow.active||D.meNow.role!==window.__ME.role){location.reload();return}
    window.__CA_APPLY(B.XL,D.perms,D.meNow.role==="super_admin"?null:(D.meNow.perms||null));lastLoad=Date.now();
  }catch(e){console.warn("refresh",e)}
  finally{refreshing=false}
}
