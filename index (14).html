sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&window.__CA_STARTED)location.reload()});

/* ───────── Bazaga yozish (write-through) ───────── */
const svcEnum=p=>{const i=SVC_NAMES.indexOf((p.svcs&&p.svcs[0])||"");return SVC_ENUM[i<0?0:i]};
const genderEnum=g=>g==="Ayol"?"female":g==="Erkak"?"male":null;
const patientFields=p=>({full_name:p.name,phone:p.phone||null,gender:genderEnum(p.gender),
  birth_date:p.birthTs?ymd(p.birthTs):null,birth_year:p.birthTs?null:(p.birthY||null)});
const DBX={
  q:Promise.resolve(),
  run(fn){this.q=this.q.then(fn).catch(e=>{console.error(e);toast(L("Bazaga saqlanmadi: ")+(e.message||e))});return this.q},
  async mgrId(name){
    if(!name||name==="—")return null;
    if(IDS.mgr[name])return IDS.mgr[name];
    const id=await ok(sb.rpc("ensure_manager",{p_name:name}));
    if(id)IDS.mgr[name]=id;return id;
  },
  async savePayments(p){
    const key=window.__SNAP.pay(p);if(key===p._pay)return;
    await ok(sb.from("payments").delete().eq("visit_id",p.vid));
    const rows=[];if(p.card>0)rows.push({visit_id:p.vid,method:"card",amount:Math.round(p.card),created_by:window.__UID});
    if(p.cash>0)rows.push({visit_id:p.vid,method:"cash",amount:Math.round(p.cash),created_by:window.__UID});
    if(rows.length)await ok(sb.from("payments").insert(rows));
    p._pay=key;
  },
  visitFields(p,mid){
    const o={service:svcEnum(p),fail_stage:p.failStage||null,doctor_id:IDS.doc[p.doc]||null,manager_id:mid,source_id:IDS.src[p.src]||null,note:p.note||null};
    if(IDS.br[p.br])o.branch_id=IDS.br[p.br];return o;
  },
  persist(p){
    return this.run(async()=>{
      if(!p.vid)return;
      const mid=await this.mgrId(p.mgr);
      await ok(sb.from("visits").update(this.visitFields(p,mid)).eq("id",p.vid));
      await this.savePayments(p);
      const k=window.__SNAP.pp(p);
      if(k!==p._pp){
        await ok(sb.from("patients").update(patientFields(p)).eq("id",p.pid));
        p._pp=k;
        (window.__CA_P||[]).forEach(x=>{if(x!==p&&x.pid===p.pid){
          Object.assign(x,{name:p.name,phone:p.phone,gender:p.gender,birthTs:p.birthTs,birthY:p.birthY,age:p.age});x._pp=k}});
      }
    });
  },
  addVisit(p){
    return this.run(async()=>{
      const pid=await ok(sb.rpc("find_or_create_patient",{p_name:p.name,p_phone:p.phone||null,p_gender:genderEnum(p.gender),
        p_birth_date:p.birthTs?ymd(p.birthTs):null,p_birth_year:p.birthTs?null:(p.birthY||null)}));
      const mid=await this.mgrId(p.mgr);
      const v=await ok(sb.from("visits").insert(Object.assign({patient_id:pid,visit_date:ymd(p.ts),created_by:window.__UID},this.visitFields(p,mid))).select("id").single());
      p.pid=pid;p.vid=v.id;p._pp=window.__SNAP.pp(p);p._pay="0|0";
      await this.savePayments(p);
    });
  },
  removeVisit(p){return this.run(async()=>{if(p.vid)await ok(sb.from("visits").delete().eq("id",p.vid))})},
  addBranch(name,mgr){
    return this.run(async()=>{const r=await ok(sb.from("branches").insert({name,manager_name:mgr||null}).select("id").single());IDS.br[name]=r.id});
  },
  removeBranch(name){return this.run(async()=>{if(IDS.br[name]){await ok(sb.from("branches").delete().eq("id",IDS.br[name]));delete IDS.br[name]}})},
  docFields(d){return {specialty:d.s&&d.s!=="—"?d.s:null,phone:d.phone||null,work_from:d.wf||null,work_to:d.wt||null,work_days:d.wd||null,main_branch_id:IDS.br[d.b]||null}},
  addDoctor(d){
    return this.run(async()=>{
      const r=await ok(sb.from("doctors").insert(Object.assign({full_name:d.n},this.docFields(d))).select("id").single());
      IDS.doc[d.n]=r.id;
      if(IDS.br[d.b])await ok(sb.from("doctor_branches").upsert({doctor_id:r.id,branch_id:IDS.br[d.b]},{onConflict:"doctor_id,branch_id",ignoreDuplicates:true}));
    });
  },
  editDoctor(name,d){
    return this.run(async()=>{
      const id=IDS.doc[name];if(!id)return;
      await ok(sb.from("doctors").update(this.docFields(d)).eq("id",id));
      if(IDS.br[d.b])await ok(sb.from("doctor_branches").upsert({doctor_id:id,branch_id:IDS.br[d.b]},{onConflict:"doctor_id,branch_id",ignoreDuplicates:true}));
    });
  },
  removeDoctor(name,heir){
    return this.run(async()=>{
      const id=IDS.doc[name];if(!id)return;
      if(heir&&IDS.doc[heir])await ok(sb.from("visits").update({doctor_id:IDS.doc[heir]}).eq("doctor_id",id));
      await ok(sb.from("doctors").delete().eq("id",id));delete IDS.doc[name];
    });
  },
  savePerms(role,perms){
    const r=ROLE_RMAP[role];if(!r||r==="super_admin")return;
    return this.run(async()=>{
      const rows=Object.keys(perms).map(k=>({role:r,permission:k,allowed:!!perms[k]}));
      await ok(sb.from("role_permissions").upsert(rows,{onConflict:"role,permission"}));
    });
  },
  setProfile(id,f){
    return this.run(async()=>{
      await ok(sb.rpc("admin_set_profile",{p_id:id,p_role:ROLE_RMAP[f.role]||"doctor",p_doctor:f.doc?IDS.doc[f.doc]||null:null,
        p_branch:f.br?IDS.br[f.br]||null:null,p_active:!!f.active,p_name:f.name||null}));
      window.__PROFILES=await ok(sb.from("profiles").select("id,full_name,email,username,role,doctor_id,branch_id,active,created_at,perms,deleted_at").order("created_at"));
    });
  },
  createUser(f){
    return this.run(async()=>{
      const nid=await ok(sb.rpc("admin_create_user",{p_username:f.login,p_password:f.password,p_name:f.name,p_role:ROLE_RMAP[f.role]||"doctor",
        p_doctor:f.doc?IDS.doc[f.doc]||null:null,p_branch:f.br?IDS.br[f.br]||null:null}));
      if(nid&&f.perms)await ok(sb.rpc("admin_set_perms",{p_id:nid,p_perms:f.perms}));
      window.__PROFILES=await ok(sb.from("profiles").select("id,full_name,email,username,role,doctor_id,branch_id,active,created_at,perms,deleted_at").order("created_at"));
      return true;
    });
  },
  removeUser(id){
    return this.run(async()=>{
      await ok(sb.rpc("admin_remove_user",{p_id:id}));
      window.__PROFILES=await ok(sb.from("profiles").select("id,full_name,email,username,role,doctor_id,branch_id,active,created_at,perms,deleted_at").order("created_at"));
    });
  },
  setUserPerms(id,perms){
    return this.run(async()=>{
      await ok(sb.rpc("admin_set_perms",{p_id:id,p_perms:perms||null}));
      window.__PROFILES=await ok(sb.from("profiles").select("id,full_name,email,username,role,doctor_id,branch_id,active,created_at,perms,deleted_at").order("created_at"));
    });
  },
  setPassword(id,pw){return this.run(async()=>{await ok(sb.rpc("admin_set_password",{p_id:id,p_password:pw}))})},
  updateMyProfile(nm,ph,pos,em){return this.run(async()=>{await ok(sb.rpc("update_my_profile",{p_name:nm,p_phone:ph||"",p_position:pos||"",p_email:em||""}))})},
  saveAvatar(data){return this.run(async()=>{await ok(sb.rpc("update_my_avatar",{p_data:data||null}))})},
  savePrefs(p){return this.run(async()=>{await ok(sb.rpc("update_my_prefs",{p_prefs:p}))})},
  async loadSecurity(){
    const [s,h,st]=await Promise.all([ok(sb.rpc("my_sessions")),ok(sb.rpc("my_login_history",{p_limit:20})),ok(sb.rpc("my_security_state"))]);
    return {sessions:s||[],history:h||[],mfa:st||{},ts:Date.now()};
  },
  async setMfaRequired(role,on){await DBX.q;await ok(sb.rpc("admin_set_mfa_required",{p_role:role,p_on:!!on}));window.__RAWPERMS=await ok(sb.from("role_permissions").select("role,permission,allowed"))},
  async resetUserMfa(id){await DBX.q;await ok(sb.rpc("admin_reset_mfa",{p_id:id}));const r=await sb.rpc("admin_mfa_overview");const m={};((r&&r.data)||[]).forEach(x=>{m[x.user_id]=!!x.enabled});window.__MFAMAP=m},
  endSession(id){return this.run(async()=>{await ok(sb.rpc("end_my_session",{p_id:id}))})},
  async endOtherSessions(){await DBX.q;return ok(sb.rpc("end_my_other_sessions"))},
  async saveAppSetting(k,v){
    await DBX.q;
    const r=await ok(sb.rpc("set_app_setting",{p_key:k,p_value:v}));
    window.__APPSET=Object.assign({},window.__APPSET||{},{[k]:(r&&typeof r==="object")?r:{}});
    window.__APPSET_AT=Object.assign({},window.__APPSET_AT||{},{[k]:new Date().toISOString()});
    return r;
  },
  auditFeed(p){return ok(sb.rpc("audit_feed",p))},
  listBackups(){return ok(sb.rpc("admin_backups"))},
  async makeBackup(){await DBX.q;return ok(sb.rpc("admin_make_backup"))},
  backupData(id){return ok(sb.rpc("admin_backup_data",{p_id:id}))},
  async restoreBackup(id,pw){await DBX.q;return ok(sb.rpc("admin_restore_backup",{p_id:id,p_password:pw}))},
  updateMyName(nm){return this.run(async()=>{await ok(sb.rpc("update_my_name",{p_name:nm}))})},
  async changePassword(oldPw,newPw){
    const a=await sb.rpc("verify_my_password",{p_password:oldPw});
    if(a.error){toast(String(a.error.message||a.error));return null}
    if(a.data!==true)return false;
    const b=await sb.auth.updateUser({password:newPw});
    if(b.error){toast("Parolni o'zgartirib bo'lmadi: "+b.error.message);return null}
    return true;
  },
  logout(){sb.auth.signOut().finally(()=>location.reload())},
  ids:IDS,

  /* ───── Eski HTML fayldan bir martalik import ───── */
  async importOld(text,progress){
    const m=text.match(/const XL=(\{[\s\S]*?\});const BR=/);
    if(!m)throw new Error(L("Faylda ma'lumot topilmadi (const XL=…). To'g'ri faylni tanlang."));
    const X=JSON.parse(m[1]);
    const head=await sb.from("visits").select("id",{count:"exact",head:true});
    if(head.error)throw head.error;
    if(head.count>0)throw new Error(L("Bazada allaqachon ")+head.count+L(" ta tashrif bor. Takroriy import bloklandi."));
    await DBX.q;
    const uid=window.__UID;
    progress(L("Filiallar, doktorlar, menejerlar…"));
    const missB=X.br.map((b,i)=>({name:b,manager_name:X.brmgr&&X.brmgr[i]>=0?X.mgr[X.brmgr[i]]:null})).filter(b=>!IDS.br[b.name]);
    if(missB.length)(await ok(sb.from("branches").insert(missB).select("id,name"))).forEach(r=>IDS.br[r.name]=r.id);
    const missM=X.mgr.filter(n=>!IDS.mgr[n]).map(n=>({full_name:n}));
    if(missM.length)(await ok(sb.from("managers").insert(missM).select("id,full_name"))).forEach(r=>IDS.mgr[r.full_name]=r.id);
    const missS=X.src.map((n,i)=>({name:n,sort_order:i})).filter(s=>!IDS.src[s.name]);
    if(missS.length)(await ok(sb.from("sources").insert(missS).select("id,name"))).forEach(r=>IDS.src[r.name]=r.id);
    const missD=X.doc.map((n,i)=>({full_name:n,main_branch_id:IDS.br[X.br[(X.docbr[i]||[])[0]]]||null})).filter(d=>!IDS.doc[d.full_name]);
    if(missD.length)(await ok(sb.from("doctors").insert(missD).select("id,full_name"))).forEach(r=>IDS.doc[r.full_name]=r.id);
    const links=[];X.doc.forEach((n,i)=>(X.docbr[i]||[]).forEach(b=>{if(IDS.doc[n]&&IDS.br[X.br[b]])links.push({doctor_id:IDS.doc[n],branch_id:IDS.br[X.br[b]]})}));
    if(links.length)await ok(sb.from("doctor_branches").upsert(links,{onConflict:"doctor_id,branch_id",ignoreDuplicates:true}));

    /* bemorlar: telefon + ism bo'yicha birlashtiriladi */
    const pmap=new Map(),patients=[],visits=[];
    X.rows.forEach(r=>{
      const k=phKey(r[1]),key=k?k+"|"+r[0].trim().toLowerCase():null;
      let pid=key?pmap.get(key):null;
      if(!pid){
        pid=crypto.randomUUID();if(key)pmap.set(key,pid);
        const bv=r[3];
        patients.push({id:pid,full_name:r[0].trim(),phone:r[1]||null,gender:r[11]==="F"?"female":r[11]==="M"?"male":null,
          birth_date:typeof bv==="string"?bv:null,birth_year:typeof bv==="number"&&bv>0?bv:null,created_by:uid});
      }
      const ds=String(r[7]);let sv=0;for(let k2=0;k2<7;k2++)if(r[10]&(1<<k2)){sv=k2;break}
      visits.push({patient_id:pid,visit_date:ds.slice(0,4)+"-"+ds.slice(4,6)+"-"+ds.slice(6,8),service:SVC_ENUM[sv],
        fail_stage:r[9]?"f_consult":null,branch_id:IDS.br[X.br[r[4]]],doctor_id:IDS.doc[X.doc[r[5]]]||null,
        manager_id:IDS.mgr[X.mgr[r[6]]]||null,source_id:IDS.src[X.src[r[2]]]||null,created_by:uid});
    });
    const N=500;
    for(let i=0;i<patients.length;i+=N){
      progress(L("Bemorlar: ")+Math.min(i+N,patients.length)+" / "+patients.length);
      await ok(sb.from("patients").insert(patients.slice(i,i+N)));
    }
    for(let i=0;i<visits.length;i+=N){
      progress(L("Tashriflar: ")+Math.min(i+N,visits.length)+" / "+visits.length);
      await ok(sb.from("visits").insert(visits.slice(i,i+N)));
    }
    progress(L("Tayyor! ")+patients.length+L(" bemor va ")+visits.length+L(" tashrif ko'chirildi. Sahifa yangilanmoqda…"));
    return {patients:patients.length,visits:visits.length};
  }
};
window.DBX=DBX;

start();
})();

</script>
